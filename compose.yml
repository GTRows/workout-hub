# Resource defaults tuned for a single-host x86_64 home server.
# Total ceiling: 4 CPU + 1536 MB. Reservations: 1 CPU + 640 MB.
# To run on smaller hosts (Raspberry Pi etc.), override via
# docker-compose.override.yml (see docker-compose.override.yml.example
# once Phase 6 lands).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres/:/var/lib/postgresql/data
    networks:
      - workouthub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    networks:
      - workouthub-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 384M

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - workouthub-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Optional: PostgreSQL backup sidecar.
  # Enable with COMPOSE_PROFILES=backup in your .env, or:
  #   docker compose --profile backup up -d
  # Snapshots written to ./data/backups/, retained per PG_DUMP_RETENTION_DAYS.
  pg_dump:
    image: prodrigestivill/postgres-backup-local:16
    profiles: ["backup"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--format=custom --blobs"
      SCHEDULE: ${PG_DUMP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${PG_DUMP_RETENTION_DAYS:-7}
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./data/backups/:/backups
    networks:
      - workouthub-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

networks:
  workouthub-net:
    name: workouthub-net
