spring:
  application:
    name: workouthub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  version: ${APP_VERSION:0.3.2}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${APP_JWT_REFRESH_TTL_SECONDS:1209600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password-hash: ${APP_ADMIN_PASSWORD_HASH:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Admin}
  auth:
    mode: ${APP_AUTH_MODE:builtin}
    trusted-proxies: ${APP_AUTH_TRUSTED_PROXIES:}
    headers:
      user: ${APP_AUTH_HEADER_USER:X-Forwarded-User}
      email: ${APP_AUTH_HEADER_EMAIL:X-Forwarded-Email}
      groups: ${APP_AUTH_HEADER_GROUPS:X-Forwarded-Groups}
  push:
    vapid:
      public-key: ${APP_PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${APP_PUSH_VAPID_PRIVATE_KEY:}
      subject: ${APP_PUSH_VAPID_SUBJECT:mailto:admin@localhost}
  reminders:
    workout-cron: ${APP_REMINDERS_WORKOUT_CRON:-}
    weight-cron: ${APP_REMINDERS_WEIGHT_CRON:-}
    supplement-cron: ${APP_REMINDERS_SUPPLEMENT_CRON:-}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: workouthub
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: method
  paths-to-match: /api/**
  # Phase 45 deleted this opt-out on the assumption that SpringDoc 2.7+ would
  # surface ApiError via the default path. Under SpringDoc 3.0.3 + Spring Boot 4
  # the default still wraps @ExceptionHandler return bodies in a generic Object
  # response, so the schema disappears from components.schemas. Restore the
  # opt-out to keep the OpenApi surface (and OpenApiSurfaceIntegrationTest) green.
  override-with-generic-response: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.workouthub: DEBUG
  include-application-name: false
  # Enable JSON (ECS) structured logs on the 'prod' profile only so local
  # devs still get readable console output. The per-profile override lives
  # in application-prod.yml.
  pattern:
    correlation: "[%X{trace_id:-}] "
