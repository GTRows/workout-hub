spring:
  application:
    name: workouthub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${APP_JWT_REFRESH_TTL_SECONDS:1209600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password-hash: ${APP_ADMIN_PASSWORD_HASH:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Admin}
  push:
    vapid:
      public-key: ${APP_PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${APP_PUSH_VAPID_PRIVATE_KEY:}
      subject: ${APP_PUSH_VAPID_SUBJECT:mailto:admin@localhost}
  reminders:
    workout-cron: ${APP_REMINDERS_WORKOUT_CRON:-}
    weight-cron: ${APP_REMINDERS_WEIGHT_CRON:-}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.workouthub: DEBUG
