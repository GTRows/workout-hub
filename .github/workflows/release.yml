name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/workouthub

jobs:
  verify-changelog:
    name: Verify changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG has entry for this version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [${VERSION}]'. Add it before releasing."
            exit 1
          fi

  test:
    name: Test
    needs: verify-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend mvn verify
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck + test
        working-directory: frontend
        run: pnpm typecheck && pnpm test

  build-and-push:
    name: Build and push ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tags
        shell: bash
        run: |
          # GHCR (Docker registry) repo names must be lowercase. github.repository_owner
          # preserves the original casing (e.g. GTRows), so lowercase the full prefix.
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}-${{ matrix.component }}"
          IMAGE="${IMAGE,,}"
          # Contract section 3.1: pinned vX.Y.Z only. No :latest, no floating alias.
          echo "tags=$IMAGE:${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Capture digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.component }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: ${{ runner.temp }}/digests/${{ matrix.component }}.txt
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture=1; next }
            /^## \[/ && capture { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Empty release notes for v${VERSION}."
            exit 1
          fi
          BACKEND_DIGEST=$(cat digests/backend.txt)
          FRONTEND_DIGEST=$(cat digests/frontend.txt)
          # GHCR repo names must be lowercase; IMAGE_PREFIX preserves the
          # original github.repository_owner casing, so lowercase it here too.
          IMAGE_PREFIX="${IMAGE_PREFIX,,}"
          BT=$(printf '\140')
          {
            printf '\n## Container images (multi-arch: amd64 + arm64)\n\nPull the matching tag from GHCR:\n\n'
            printf -- '- %s%s/%s-backend:%s%s\n' "$BT" "$REGISTRY" "$IMAGE_PREFIX" "$VERSION" "$BT"
            printf -- '- %s%s/%s-frontend:%s%s\n' "$BT" "$REGISTRY" "$IMAGE_PREFIX" "$VERSION" "$BT"
            printf '\n### Image digests (pinned by digest, no :latest)\n\n'
            printf -- '- %s%s/%s-backend@%s%s\n' "$BT" "$REGISTRY" "$IMAGE_PREFIX" "$BACKEND_DIGEST" "$BT"
            printf -- '- %s%s/%s-frontend@%s%s\n' "$BT" "$REGISTRY" "$IMAGE_PREFIX" "$FRONTEND_DIGEST" "$BT"
            printf '\n## Operator migration notes\n\nSee [docs/MIGRATION.md](docs/MIGRATION.md) for the per-version migration steps.\n'
          } >> RELEASE_NOTES.md

      - name: Bundle deployment artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/workouthub-compose-v${VERSION}.tar.gz" \
              compose.yml \
              docker-compose.override.yml.example \
              .env.example \
              docs/MIGRATION.md \
              docs/DEPLOYMENT.md \
              docs/BACKUP.md \
              docs/SELF_HOSTED_CONTRACT.md

      - name: Determine prerelease
        id: prerelease
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
