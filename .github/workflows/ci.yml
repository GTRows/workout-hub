name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify (Testcontainers uses the runner's Docker)
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Unit tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload vitest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy_fs:
    name: trivy fs (filesystem CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  trivy_image:
    name: trivy image (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t workouthub-${{ matrix.component }}:ci ./${{ matrix.component }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: workouthub-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  compose_config:
    name: docker compose config
    runs-on: ubuntu-latest
    env:
      BIND_ADDR: 127.0.0.1
      BACKEND_PORT: "8080"
      FRONTEND_PORT: "3000"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-test-non-secret
      POSTGRES_DB: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ci
      SPRING_DATASOURCE_USERNAME: ci
      SPRING_DATASOURCE_PASSWORD: ci-test-non-secret
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      APP_JWT_SECRET: ci-test-jwt-secret-32-bytes-min-0123456789abcdef
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Materialize CI dotenv
        run: env | grep -E '^(BIND_ADDR|BACKEND_PORT|FRONTEND_PORT|POSTGRES_|SPRING_|SERVER_PORT|APP_JWT_SECRET|NEXT_PUBLIC_)' > dotenv.tmp && mv dotenv.tmp .env
      - name: Validate compose config
        run: docker compose -f compose.yml config > /dev/null

  hadolint:
    name: hadolint (${{ matrix.component }} Dockerfile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  shellcheck:
    name: shellcheck (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          if [ -d scripts ] && find scripts -name '*.sh' -print -quit | grep -q .; then
            sudo apt-get update && sudo apt-get install -y shellcheck
            find scripts -name '*.sh' -print0 | xargs -0 shellcheck
          else
            echo "No scripts to lint."
          fi
