# WorkoutHub production reverse proxy. Terminates TLS and proxies to
# the locally-bound backend and frontend services. Rate-limits the auth
# surface to make credential stuffing expensive.

# 10 requests/minute per client IP, with 5 burst. Applies to login and
# refresh. The 10MB zone fits roughly 160k active IPs.
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/live/workouthub/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/workouthub/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=auth_rl burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
