# Production overlay. Use with compose.yml:
#   docker compose -f compose.yml -f compose.prod.yml up -d
# Puts nginx in front of backend + frontend, terminates TLS via a
# certbot-managed volume, and binds the app services to localhost only
# so nothing is reachable except through the proxy.

services:
  db:
    ports: []

  backend:
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

volumes:
  certbot_www:
